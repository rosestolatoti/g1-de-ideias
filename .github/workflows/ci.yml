name: CI — G1 DE IDEIAS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          tesseract --version
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . || true
      - name: Tests
        run: pytest -v --tb=short
        env:
          FLASK_ENV: testing
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Generate site (smoke)
        run: |
          python scripts/generate_site.py
          ls -lh index.html detalhe/ | head -n 20
          test -f index.html
      - name: Health check (flask)
        run: |
          timeout 10 python app.py &
          sleep 3
          curl -s http://127.0.0.1:5000/health | grep -q '"status": "ok"'
          pkill -f "python app.py" || true

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Docker build smoke
        run: docker build -t g1-ideias:ci .
