name: Pages — G1 DE IDEIAS (24/7 sem Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 06:00 BRT diário

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          tesseract --version
      - name: Install
        run: pip install -r requirements.txt
      - name: JEV health + generate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python -c "from app.services.jev_service import get_jev; print(get_jev().health())"
          python scripts/generate_site.py
          python scripts/sync_sqlite.py || true
          ls -lh index.html
          ls detalhe/ | wc -l
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # inclui index.html + detalhe + prints/cropped + data + templates

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
