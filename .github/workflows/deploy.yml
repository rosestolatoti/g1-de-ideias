name: Deploy — G1 DE IDEIAS (Vercel + Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild diário 06:00 BRT (09:00 UTC) — garante que cron-like peneira novos prints se houver webhook
    - cron: "0 9 * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          tesseract --version

      - name: Install
        run: pip install -r requirements.txt

      - name: JEV Pipeline (dry → real)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          echo "Health JEV:"
          python -c "from app.services.jev_service import get_jev; print(get_jev().health())"
          echo "Dry-run pipeline (sem commit):"
          python scripts/pipeline.py --dry-run --limit 5 || true
          # Se houver prints commited em prints/original, processa:
          if ls prints/original/*.png 1>/dev/null 2>&1; then
            python scripts/pipeline.py --limit 20 || true
          else
            echo "Sem prints novos em prints/original, só gera site"
          fi

      - name: Generate static site
        run: |
          python scripts/generate_site.py
          python scripts/sync_sqlite.py || true
          ls -lh index.html
          ls detalhe/ | wc -l
          echo "Index size:" $(wc -c < index.html)

      - name: Commit updated JSON/DB if changed (bot)
        run: |
          git config user.name "fabricio-bot"
          git config user.email "fabricio@g1deideiasdofabio.com"
          git add data/noticias.json data/noticias.db prints/cropped prints/original detalhe index.html || true
          git diff --cached --quiet && echo "Nada pra commitar" && exit 0
          git commit -m "chore: pipeline JEV $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: g1-de-ideias
          directory: ./
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
